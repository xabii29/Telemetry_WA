<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ================= BARRA DE NAVEGACIÓN ================= -->
    <nav class="navbar">
        <button class="nav-tab active" data-tab="home">Home</button>
        <button class="nav-tab" data-tab="dyno">Dyno</button>
        <button class="nav-tab" data-tab="velocidades">Velocidades</button>
        <button class="nav-tab" data-tab="pista">Pista</button>
        <button class="nav-tab" data-tab="suspension">Suspensión</button>
    </nav>

    <!-- ================= INFO DEL AUTO (compartida, debajo de la nav) ================= -->
    <div class="car-info-bar">
        <span id="car-name" class="car-info-value">Esperando datos...</span>
        <span class="car-info-sep">·</span>
        <span class="car-info-value">PI <span id="detail-pi">--</span></span>
        <span class="car-info-sep">·</span>
        <span id="detail-engine" class="car-info-value">--</span>
        <span class="car-info-sep">·</span>
        <span id="detail-drivetrain" class="car-info-value">--</span>
    </div>

    <!-- ================= CONTENIDO DE CADA PESTAÑA ================= -->
    <div class="tab-content">

        <!-- ----------- HOME: grid 2x2, una mini-grafica por modulo ----------- -->
        <section id="tab-home" class="tab-pane active">
            <div class="pedals-section">
                <div id="plot-pedals" class="pedals-plot"></div>
            </div>
            <div class="home-grid">
                <div class="home-cell">
                    <div id="plot-home-dyno" class="plot-area"></div>
                </div>
                <div class="home-cell">
                    <div id="plot-home-velocidades" class="plot-area placeholder-mini">Velocidades</div>
                </div>
                <div class="home-cell">
                    <div id="plot-home-pista" class="plot-area"></div>
                </div>
                <div class="home-cell">
                    <div id="plot-home-suspension" class="plot-area placeholder-mini">Suspensión</div>
                </div>
            </div>
        </section>

        <!-- ----------- DYNO: layout completo (sidebar + gráfica + botones) ----------- -->
        <section id="tab-dyno" class="tab-pane">
            <div class="layout">
                <aside class="side-panel">
                    <h2 class="heading">Resultados en vivo</h2>
                    <div class="stat-card">
                        <div class="secondary">Pico de potencia</div>
                        <div id="peak-hp" class="stat-value">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="secondary">Pico de torque</div>
                        <div id="peak-torque" class="stat-value">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="secondary">Banda de potencia</div>
                        <div id="band" class="stat-value">--</div>
                    </div>

                    <div class="spacer"></div>

                    <h2 class="heading">Unidades</h2>
                    <div class="unit-row">
                        <label>Potencia</label>
                        <select id="power-unit">
                            <option value="HP">HP</option>
                            <option value="kW">kW</option>
                        </select>
                    </div>
                    <div class="unit-row">
                        <label>Torque</label>
                        <select id="torque-unit">
                            <option value="lbft">lb-ft</option>
                            <option value="Nm">Nm</option>
                        </select>
                    </div>
                </aside>

                <main class="main-panel">
                    <div id="plot" class="plot-area"></div>

                    <div class="progress-bar-outer">
                        <div id="progress-bar-inner" class="progress-bar-inner"></div>
                        <span id="progress-text" class="progress-text">Precisión 0%</span>
                    </div>

                    <div class="button-row">
                        <button id="btn-stop" class="btn btn-danger">Detener captura</button>
                        <button id="btn-save" class="btn btn-primary" disabled>Guardar</button>
                        <button id="btn-restart" class="btn" disabled>Reiniciar</button>
                    </div>
                    <p id="save-status" class="save-status"></p>
                </main>
            </div>
        </section>

        <!-- ----------- VELOCIDADES: placeholder ----------- -->
        <section id="tab-velocidades" class="tab-pane">
            <div class="placeholder-pane">
                <p class="placeholder-title">Velocidades</p>
                <p class="secondary">Próximamente: optimización de relaciones de marcha.</p>
            </div>
        </section>

        <!-- ----------- PISTA: mapa de trazado en vivo ----------- -->
        <section id="tab-pista" class="tab-pane">
            <main class="main-panel">
                <div id="plot-track" class="plot-area"></div>
                <div class="button-row">
                    <button id="btn-restart-track" class="btn">Reiniciar trazado</button>
                </div>
            </main>
        </section>

        <!-- ----------- SUSPENSIÓN: placeholder ----------- -->
        <section id="tab-suspension" class="tab-pane">
            <div class="placeholder-pane">
                <p class="placeholder-title">Suspensión</p>
                <p class="secondary">Próximamente: balance y transferencia de masa.</p>
            </div>
        </section>

    </div>

    <script src="/static/app.js"></script>
</body>
</html>
